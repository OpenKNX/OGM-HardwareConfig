# Checks every change of OGM-HardwareConfig: board headers (IDs, names, texts) and the generator.
# Runs the generator with Windows PowerShell 5.1 (the version of a Windows 10 developer machine).
#   1. -ListIds: every DEVICE_HW_ID once, DEVICE_ID / DEVICE_NAME present, HW_INFO_TEXT <= 255 characters
#   2. -Check on the demo: the committed generated files match the headers and the generator
#   3. job summary: board list and, when the check fails, which generated files the change affects
#   4. -SelfTest: generator/tests/Test-HardwareProfile.ps1 (also proves the generator on Windows PowerShell 5.1)
# PlatformIO CLI plus the platforms of the demo envs without their packages: the board manifests give MCU, memory type
# and BOARD_HAS_PSRAM (ESP32 flash / PSRAM GPIOs of <Conflicts reserved>); no toolchain, so the preprocessor is the host
# compiler (g++ / clang++ in PATH), see generator/README.md "Ein Ausdruck, zwei Verbraucher".
name: Hardware profile

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout OGM-HardwareConfig
        uses: actions/checkout@v4

      - name: Checkout OGM-Common (platformio ini files of the demo)
        uses: actions/checkout@v4
        with:
          repository: OpenKNX/OGM-Common
          path: _deps/OGM-Common

      - name: Tools (PlatformIO, C++ preprocessor)
        run: |
          $PSVersionTable.PSVersion
          python -m pip install --quiet platformio
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress }
          g++ --version

      - name: Demo library links
        run: |
          $lib = "examples/HardwareProfileDemo/lib"
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          New-Item -ItemType Junction -Path "$lib/OGM-Common" -Target (Resolve-Path "_deps/OGM-Common") | Out-Null
          New-Item -ItemType Junction -Path "$lib/OGM-HardwareConfig" -Target (Resolve-Path ".") | Out-Null

      - name: PlatformIO platforms of the demo (board manifests, no toolchains)
        working-directory: examples/HardwareProfileDemo
        run: |
          # without the board manifest an env has no MCU: an ESP32 board loses its flash / PSRAM GPIOs and -Check differs
          # pio / git write progress to stderr; exit codes decide
          $ErrorActionPreference = "Continue"
          $json = (pio project config -d . --json-output) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $specs = @()
          foreach ($section in (ConvertFrom-Json $json)) {
            if (-not ([string]$section[0]).StartsWith("env:")) { continue }
            foreach ($option in $section[1]) { if ($option[0] -eq "platform") { $specs += [string]$option[1] } }
          }
          if ($specs.Count -eq 0) { Write-Host "no platform in the demo envs"; exit 1 }
          foreach ($spec in @($specs | Sort-Object -Unique)) {
            pio pkg install --global --skip-dependencies --platform $spec
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Board headers (-ListIds)
        run: |
          # in-process call: the table rows come back as strings (no console width, no wrapping); banner and steps
          # are Write-Host and stay out of $out; exit in the script ends only the script and sets $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $out = @(& ./generator/Build-HardwareProfile.ps1 -ListIds -Markdown)
          $rc = $LASTEXITCODE
          $out
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $table = @($out | ForEach-Object { "$_" } | Where-Object { $_.StartsWith("|") })
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "## Boards with DEVICE_HW_ID`n`n" + ($table -join "`n") + "`n", $utf8)
          if ($rc -ne 0) { exit 1 }

      - name: Generated files of the demo are current (-Check)
        working-directory: examples/HardwareProfileDemo
        run: |
          powershell -NoProfile -File ../../generator/Build-HardwareProfile.ps1 -Check
          if ($LASTEXITCODE -eq 0) { exit 0 }
          # show what the change does to the generated files (new files included)
          powershell -NoProfile -File ../../generator/Build-HardwareProfile.ps1
          $genRc = $LASTEXITCODE
          $changed = @(git status --porcelain -- .)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $fence = ([string][char]96) * 3
          if ($genRc -ne 0) { $text = "## The generator stops on this change (see the step log)`n" }
          else { $text = "## Generated files that change (run the generator and commit them)`n`n$fence`n" + ($changed -join "`n") + "`n$fence`n" }
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $text, $utf8)
          $changed
          exit 1

      - name: Self-test of the generator (-SelfTest)
        run: |
          # small test manifests: bit order, version guard, manifest check, <Fixes>, -Init, helpers, HardwarePorts.h, demo -Check
          powershell -NoProfile -File generator/Build-HardwareProfile.ps1 -SelfTest
          exit $LASTEXITCODE

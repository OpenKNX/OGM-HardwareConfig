; OAM-HardwareProfileDemo - PlatformIO configuration
;
; Two real boards of OGM-HardwareConfig, one RP2350 and one ESP32-S3. Both run the same firmware;
; the hardware profile (HardwareProfileData.h) is evaluated by the compiler per board.

[platformio]
extra_configs =
  lib/OGM-Common/platformio.base.ini
  lib/OGM-Common/platformio.rp2040.ini
  lib/OGM-Common/platformio.esp32.ini

[custom]
; flash size and filesystem from DEVICE_FLASH_SIZE_MB of the board header (OGM-Common prepare_flash_size.py)
custom_flash_size = hwcfg
build_flags =
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_LOOPTIME_WARNING=100

; OpenKNXiao V1 KNeoPix RP2350 (DEVICE_HW_ID 0x1310)
[env:release_OKNXHW_OPENKNXIAO_KNEOPIX_RP2350_V1]
extends = RP2040_releases, custom
board = rpipico2
board_build.f_cpu = 150000000L
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_releases.build_flags}
  ${custom.build_flags}
  -D OKNXHW_OPENKNXIAO_KNEOPIX_RP2350_V1

; OpenKNXiao V1 KNeoPix ESP32-S3 (DEVICE_HW_ID 0x1320)
[env:release_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1]
extends = ESP32_releases, custom, ESP32_8MB
board = seeed_xiao_esp32s3
build_flags =
  ${KNX_TP.build_flags}
  ${ESP32_releases.build_flags}
  ${custom.build_flags}
  -D OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1

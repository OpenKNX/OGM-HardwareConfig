<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="532" height="70" viewBox="0 0 532 70">
  <!-- Steps of the device query on the hardware page (<Page queryImage>): 1 program the physical address (finger on the
       programming button, address goes in), 2 click another page in the tree and come back, 3 press the button.
       No words: the ETS text next to it carries them. Transparent (the page width follows the window, so the picture has no edge of its own); pictograms at 65 % of the
       symbol size, centred in 532 px (content x 44..488); content left of 525 px (ETS5 cuts there). -->
  <defs>
    <symbol id="prog" viewBox="0 0 120 96">
      <rect x="38" y="10" width="44" height="76" rx="4" fill="#ffffff" stroke="#4d78b4" stroke-width="3"/>
      <path d="M46 10v-5M56 10v-5M64 10v-5M74 10v-5" stroke="#4d78b4" stroke-width="3"/>
      <circle cx="60" cy="58" r="7" fill="#d64545"/>
      <path d="M83 76 l-12 -11 a4 4 0 0 1 5.5 -5.6 l3.5 3.2 l0 -16 a4 4 0 0 1 8 0 l0 9 l9 2 a5 5 0 0 1 4 5.5 l-2 13 z" fill="#f2d4bd" stroke="#8a5a3c" stroke-width="2" stroke-linejoin="round"/>
      <rect x="2" y="20" width="30" height="16" rx="3" fill="#ffffff" stroke="#4d78b4" stroke-width="2"/>
      <text x="17" y="32" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="700" fill="#2b2b2b">1.1.20</text>
      <path d="M32 28h6" stroke="#4d78b4" stroke-width="2.5"/>
      <path d="M35 24l4 4l-4 4" fill="none" stroke="#4d78b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="tree" viewBox="0 0 120 96">
      <rect x="18" y="10" width="76" height="76" rx="3" fill="#f5f6f8" stroke="#4d78b4" stroke-width="3"/>
      <rect x="26" y="20" width="58" height="12" rx="2" fill="#d6dae3"/>
      <rect x="26" y="40" width="58" height="12" rx="2" fill="#dbe6f5" stroke="#4d78b4" stroke-width="2"/>
      <rect x="26" y="60" width="58" height="12" rx="2" fill="#d6dae3"/>
      <path d="M70 62 l0 18 l5 -5 l4 8 l4 -2 l-4 -8 l7 -1 z" fill="#2b2b2b" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M100 66 c12 -4 12 -22 0 -22" fill="none" stroke="#2f7d4f" stroke-width="3" stroke-linecap="round"/>
      <path d="M103 39 l-5 5 l6 4" fill="none" stroke="#2f7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="read" viewBox="0 0 120 96">
      <rect x="8" y="30" width="78" height="26" rx="3" fill="#f7f7f7" stroke="#4d78b4" stroke-width="3"/>
      <path d="M20 43h50" stroke="#4d78b4" stroke-width="3"/>
      <path d="M62 46 l0 26 l6 -6 l5 10 l5 -2.5 l-5 -10 l9 -1 z" fill="#2b2b2b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="98" cy="26" r="15" fill="#2f7d4f"/>
      <path d="M90 26 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="arrow" viewBox="0 0 24 24">
      <path d="M3 12h15M13 6l6 6l-6 6" fill="none" stroke="#9aa7bb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <use xlink:href="#prog" x="49.2" y="4" width="78.0" height="62.4"/>
  <use xlink:href="#tree" x="231.4" y="4" width="78.0" height="62.4"/>
  <use xlink:href="#read" x="413.7" y="4" width="78.0" height="62.4"/>
  <use xlink:href="#arrow" x="171.3" y="27.2" width="16.0" height="16.0"/>
  <use xlink:href="#arrow" x="353.6" y="27.2" width="16.0" height="16.0"/>
  <g font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="11.0" fill="#ffffff">
  <circle cx="53.1" cy="12.0" r="8.0" fill="#4d78b4"/>
  <text x="53.1" y="16.0" text-anchor="middle">1</text>
  <circle cx="235.3" cy="12.0" r="8.0" fill="#4d78b4"/>
  <text x="235.3" y="16.0" text-anchor="middle">2</text>
  <circle cx="417.6" cy="12.0" r="8.0" fill="#4d78b4"/>
  <text x="417.6" y="16.0" text-anchor="middle">3</text>
  </g>
  </svg>